[pytest]
pythonpath = src test
testpaths = test
python_files = test_*.py
markers =
    slow: tests that take more than a few seconds
    network: tests that intentionally exercise network code (must mock)
    ui: tests that construct Qt windows
    real_batch_confirm: keep the batch summary's discard prompt (conftest skips it otherwise)
addopts = --durations=15
