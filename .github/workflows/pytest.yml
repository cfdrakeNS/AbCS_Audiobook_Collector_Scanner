name: pytest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt "coverage==7.17.2"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest test/ -q --tb=line --durations=15 --cov=src/core --cov=src/database --cov-report=term-missing:skip-covered
